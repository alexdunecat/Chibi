name: Release

# Публикуйте релиз с тегом вида v1.2.3: workflow подставит версию в module.json,
# соберёт module.zip и приложит оба файла к релизу.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version and download URL
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg d "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             --arg m "https://github.com/$REPO/releases/latest/download/module.json" \
             '.version = $v | .download = $d | .manifest = $m' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Build zip
        run: zip -r module.zip module.json README.md scripts styles lang

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" module.json module.zip --clobber
