name: Release

# Запушьте тег вида v1.2.3: workflow подставит версию в module.json,
# соберёт module.zip и опубликует релиз с обоими файлами.
# Если релиз с этим тегом уже создан вручную, файлы просто приложатся к нему.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version and download URL
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg d "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             --arg m "https://github.com/$REPO/releases/latest/download/module.json" \
             '.version = $v | .download = $d | .manifest = $m' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Build zip
        run: zip -r module.zip module.json README.md scripts styles lang

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" module.json module.zip --clobber
